<title>UiOSD Debug</title>

<style>
  * { box-sizing: border-box; }
  pre {
    text-shadow: -4px 0 black, 0 4px black, 4px 0 black, 0 -4px black;
    font-weight: bold;
    color: white;
    border: 4px solid black;
    width: min-content;
    margin: 0;
  }
  div {
    margin: 0 auto;
    width: min-content;
  }
  html {
    font-size: 3rem;
  }
</style>

<div>
  <pre></pre>
  <button id="conect">conect</button>
  <button id="clear">clear</button>
  <input id="barcode" placeholder="barcode" />
  <button id="barcode">barcode</button>
</div>

<script>

  const connectBtn = document.querySelector('button#conect')
  const clearBtn = document.querySelector('button#clear')
  const barcodeBtn = document.querySelector('button#barcode')
  const barcodeInput = document.querySelector('input#barcode')
  const pre = document.querySelector('pre')
  let preWidth = 53
  let preHeight = 20
  let preBuff = new Array(preHeight).fill().map(v => new Array(preWidth).fill(' '))

  const preRender = () => {
    pre.innerHTML = preBuff.map(v => v.join('')).join('\n')
  }
  preRender()

  let items = {}
  const updateItems = item => {
    items[item.id] = item

    preBuff = new Array(preHeight).fill().map(v => new Array(preWidth).fill(' '))

    for (const id in items) {
      const item = items[id]
      for (let i = 0; i < item.len; i++)
        if (item.x < preBuff.length && item.y + i < preBuff[0].length)
          preBuff[item.x][item.y + i] = String.fromCharCode(item.buf[i])
    }

    preRender()
  }

  clearBtn.addEventListener('click', async () => {
    items = {}
    preRender()
  })

  connectBtn.addEventListener('click', async () => {
    const port = await navigator.serial.requestPort()

    await port.open({ baudRate: 115200 })

    
    barcodeBtn.onclick = async () => {
      const encoder = new TextEncoder()
      const writer = port.writable.getWriter()
      const encoded = encoder.encode(barcodeInput.value + '\n')
      await writer.write(encoded).then(console.log)
      writer.releaseLock()
    }

    while (port.readable) {
      const reader = port.readable.getReader()

      try {
        while (true) {
          const { value, done } = await reader.read()
          if (done) {
            reader.releaseLock()
            break
          }
          if (value) {
            [...value].map(v => parseCh(v, updateItems))
          }
        }
      } catch (error) {
        console.error(error)
      }
      console.log('not readable, loop closed')

    }

  })

  const LOOKING_FOR_U = 0
  const LOOKING_FOR_I = 1
  const LOOKING_FOR_ID = 2
  const LOOKING_FOR_X = 3
  const LOOKING_FOR_Y = 4
  const LOOKING_FOR_LEN = 5
  const LOOKING_FOR_BUF = 6
  let parseState = LOOKING_FOR_U
  let parseMessage = {}
  function parseCh(ch, onMsg) {
    switch (parseState) {
      case LOOKING_FOR_U:
        if (ch == 85)
          parseState = LOOKING_FOR_I
        break
      case LOOKING_FOR_I:
        if (ch == 73)
          parseState = LOOKING_FOR_ID
        break
      case LOOKING_FOR_ID:
        parseMessage = {}
        parseMessage.id = ch
        parseState = LOOKING_FOR_X
        break
      case LOOKING_FOR_X:
        parseMessage.x = ch
        parseState = LOOKING_FOR_Y
        break
      case LOOKING_FOR_Y:
        parseMessage.y = ch
        parseState = LOOKING_FOR_LEN
        break
      case LOOKING_FOR_LEN:
        parseMessage.len = ch
        parseMessage.buf = []
        if (ch) {
          parseState = LOOKING_FOR_BUF
        } else {
          parseState = LOOKING_FOR_U
          onMsg?.(parseMessage)
        }
        break
      case LOOKING_FOR_BUF:
        parseMessage.buf.push(ch)
        if (parseMessage.buf.length >= parseMessage.len) {
          parseState = LOOKING_FOR_U
          parseMessage.str = parseMessage.buf.map(v => String.fromCharCode(v)).join('')
          onMsg?.(parseMessage)
        }
        break
    }
  }

</script>
