[General]
TcpServerPort=5760
ReportStats=false

# Последовательный порт для подключения к полётному контроллеру
[UartEndpoint flightcontroller]
Device=/dev/ttyACM0
Baud=2000000

# UDP endpoint для нашего приложения
[UdpEndpoint myapp]
Mode=Normal
Address=127.0.0.1
Port=14550

# UDP endpoint для Mission Planner (принимает подключения)
[UdpEndpoint missionplanner]
Mode=Normal
Address=0.0.0.0
Port=14550

