[tool.poetry]
name = "uvl-photo-project"
version = "0.1.1"
description = "Система автоматического фотографирования для Raspberry Pi с Ardupilot"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
packages = [{include = "uvl_photo"}]

[tool.poetry.dependencies]
python = "^3.9"
pymavlink = "^2.4.37"
picamera2 = "^0.3.12"
numpy = "^1.24.0"
pyserial = "^3.5"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0"
black = "^23.0"
ruff = "^0.1.0"

[tool.poetry.scripts]
uvl-photo = "uvl_photo.main:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py39']

[tool.ruff]
line-length = 100
target-version = "py39"

